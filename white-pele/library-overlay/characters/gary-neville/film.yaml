# Drawings this character is filmed in (studio/film/art.py): each is cut whole from its sheet, upscaled 4x and
# given face landmarks. Check build/film/gary-neville_check.jpg after any change.
drawings:
  front: {kit: casual/front, faces: F}
  q34:   {kit: casual/three_quarter, faces: R}
  side:  {kit: casual/side, faces: R}
  # The White Pelé: Pass Mic's bold Style 1 cut-outs (reference/passmic/, ab19902020/Passmic series/ep01), the
  # same sheet family as Mark Goldbridge's; on-style, unlike the stand-in kit above
  stand: {image: reference/passmic/body/stand_neutral.png, faces: F,
          marks: {eyes: [[360, 400, 70, 45], [500, 400, 60, 45]], mouth: [385, 622, 470, 620, 428, 614], chin: 735, neck: [430, 800]}}
  walk1: {image: reference/white-pele/walk1.png, faces: R, plain: true}
  walk2: {image: reference/white-pele/walk2.png, faces: R, plain: true}
  walk3: {image: reference/white-pele/walk3.png, faces: R, plain: true}
  walk4: {image: reference/white-pele/walk4.png, faces: R, plain: true}
  armsdown: {image: reference/passmic/upper/arms_down.png, faces: F}
  pointing: {image: reference/passmic/upper/pointing.png, faces: F}
  clipboard: {image: reference/white-pele/clipboard.png, faces: R, marks: {eyes: [[720, 730, 85, 60], [960, 735, 70, 55]]}}   # his phone made a clipboard (White Pelé)
