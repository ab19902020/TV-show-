<script>
const CUES = [{"sequence": 1, "beat": 1, "start": 0.44, "end": 7.69, "phrase": "I want to share some information about the ongoing disciplinary process between Manchester City and the Premier League.", "tag": "sigh", "camera": "A", "gesture": "G07 hands clasped", "expression": "neutral corporate", "overlay": ""}, {"sequence": 2, "beat": 1, "start": 8.41, "end": 10.12, "phrase": "Essentially, we DID it.", "tag": "laughs", "camera": "A > C", "gesture": "G01 one palm (his right)", "expression": "neutral corporate", "overlay": ""}, {"sequence": 3, "beat": 1, "start": 10.64, "end": 13.42, "phrase": "But I think people are being very negative about that.", "tag": "", "camera": "A", "gesture": "G01 one palm (his right) > G01 palms up", "expression": "smug smile > neutral corporate > brows raised", "overlay": ""}, {"sequence": 4, "beat": 2, "start": 14.06, "end": 17.94, "phrase": "A document has been published which is negative to our interests.", "tag": "", "camera": "B", "gesture": "G01 one palm (his right)", "expression": "neutral corporate > mildly offended", "overlay": ""}, {"sequence": 5, "beat": 2, "start": 19.31, "end": 22.23, "phrase": "Unfortunately, it is also quite ACCURATE.", "tag": "sigh", "camera": "B", "gesture": "G07 hands clasped", "expression": "mildly offended", "overlay": ""}, {"sequence": 6, "beat": 2, "start": 22.84, "end": 26.63, "phrase": "We had specifically asked for those two things not to happen together.", "tag": "laughs", "camera": "B", "gesture": "G08 dismissive wave > G07 hands clasped", "expression": "mildly offended > neutral corporate", "overlay": "ACCURATE / UNHELPFUL"}, {"sequence": 7, "beat": 3, "start": 27.21, "end": 37.45, "phrase": "I want to explain what happens next, how we will defend the club, and why doing everything they accused us of doesn't necessarily mean we should face CONSEQUENCES.", "tag": "", "camera": "A", "gesture": "G07 hands clasped > G04 palms forward > G07 hands clasped", "expression": "neutral corporate", "overlay": ""}, {"sequence": 8, "beat": 3, "start": 38.07, "end": 39.56, "phrase": "We've checked with our lawyers.", "tag": "", "camera": "A", "gesture": "G07 hands clasped", "expression": "neutral corporate", "overlay": ""}, {"sequence": 9, "beat": 3, "start": 40.15, "end": 42.87, "phrase": "They're happy to discuss that for several more years.", "tag": "whispers", "camera": "A > B (push)", "gesture": "G07 hands clasped", "expression": "neutral corporate", "overlay": "CASE ONGOING / METER RUNNING"}, {"sequence": 10, "beat": 4, "start": 43.51, "end": 51.22, "phrase": "The whole case is based on one accusation: that our owner's personal money was secretly put into the club through sponsors.", "tag": "sigh", "camera": "A", "gesture": "G07 hands clasped > G03 index finger > G07 hands clasped", "expression": "neutral corporate", "overlay": "CASE ONGOING / METER RUNNING"}, {"sequence": 11, "beat": 4, "start": 51.75, "end": 52.37, "phrase": "YES.", "tag": "laughs", "camera": "C", "gesture": "G07 hands clasped", "expression": "neutral corporate", "overlay": ""}, {"sequence": 12, "beat": 4, "start": 52.96, "end": 56.31, "phrase": "But \"secretly\" makes it sound sinister.", "tag": "", "camera": "A", "gesture": "G07 hands clasped > G01 one palm (his right)", "expression": "neutral corporate", "overlay": ""}, {"sequence": 13, "beat": 4, "start": 56.81, "end": 59.78, "phrase": "We simply didn't tell the people who would have STOPPED us.", "tag": "whispers", "camera": "A > B (push)", "gesture": "G07 hands clasped", "expression": "neutral corporate > glance > neutral corporate", "overlay": ""}, {"sequence": 14, "beat": 5, "start": 60.4, "end": 63.68, "phrase": "And the money didn't come DIRECTLY from the owner.", "tag": "", "camera": "A", "gesture": "G07 hands clasped > G01 one palm (his right)", "expression": "neutral corporate", "overlay": ""}, {"sequence": 15, "beat": 5, "start": 64.33, "end": 66.53, "phrase": "It went through a sponsor first.", "tag": "", "camera": "A", "gesture": "G01 one palm (his right) > G01 one palm (his left)", "expression": "neutral corporate", "overlay": ""}, {"sequence": 16, "beat": 5, "start": 67.03, "end": 68.84, "phrase": "Completely different pocket.", "tag": "laughs", "camera": "A", "gesture": "G01 one palm (his left) > G02 shrug", "expression": "neutral corporate > smug smile", "overlay": ""}, {"sequence": 17, "beat": 5, "start": 70.3, "end": 74.78, "phrase": "I don't understand why everyone keeps bringing up the TROUSERS.", "tag": "sigh", "camera": "B", "gesture": "G07 hands clasped", "expression": "neutral corporate > brows raised", "overlay": ""}, {"sequence": 18, "beat": 6, "start": 75.92, "end": 78.67, "phrase": "We supplied IRREFUTABLE evidence.", "tag": "excited", "camera": "A", "gesture": "G07 hands clasped", "expression": "neutral corporate > delighted", "overlay": ""}, {"sequence": 19, "beat": 6, "start": 79.2, "end": 82.84, "phrase": "Bank statements. Money transfers. Witnesses.", "tag": "", "camera": "A", "gesture": "G05 counting", "expression": "delighted", "overlay": ""}, {"sequence": 20, "beat": 6, "start": 83.43, "end": 88.05, "phrase": "Everything necessary to demonstrate EXACTLY what we'd done.", "tag": "", "camera": "A", "gesture": "G05 counting > G01 palms up", "expression": "delighted", "overlay": ""}, {"sequence": 21, "beat": 6, "start": 89.06, "end": 91.91, "phrase": "We thought they would appreciate how organised we were.", "tag": "sad", "camera": "A", "gesture": "G07 hands clasped", "expression": "delighted > neutral corporate > mock sadness", "overlay": ""}, {"sequence": 22, "beat": 7, "start": 92.69, "end": 94.7, "phrase": "Instead, they followed the money.", "tag": "", "camera": "B", "gesture": "G07 hands clasped", "expression": "mock sadness > neutral corporate > glance > neutral corporate > glance", "overlay": ""}, {"sequence": 23, "beat": 7, "start": 95.46, "end": 96.45, "phrase": "ALL the way.", "tag": "", "camera": "C", "gesture": "G07 hands clasped", "expression": "neutral corporate > one eyebrow raised", "overlay": ""}, {"sequence": 24, "beat": 7, "start": 96.89, "end": 100.14, "phrase": "Which, frankly, felt a bit obsessive.", "tag": "", "camera": "C", "gesture": "G07 hands clasped", "expression": "one eyebrow raised > neutral corporate > mildly offended", "overlay": ""}, {"sequence": 25, "beat": 8, "start": 101.18, "end": 105.39, "phrase": "Every other charge comes from that one simple arrangement.", "tag": "", "camera": "A", "gesture": "G07 hands clasped > G03 index finger", "expression": "neutral corporate", "overlay": ""}, {"sequence": 26, "beat": 8, "start": 106.27, "end": 114.04, "phrase": "People say \"one hundred and fifteen\" as though we sat down and broke one hundred and fifteen SEPARATE rules.", "tag": "", "camera": "A > B (push)", "gesture": "G07 hands clasped > G01 palms up", "expression": "neutral corporate > delighted > smug smile", "overlay": "115"}, {"sequence": 27, "beat": 8, "start": 114.87, "end": 117.24, "phrase": "We were much more efficient than that.", "tag": "laughs", "camera": "B (push)", "gesture": "G01 palms up > G07 hands clasped", "expression": "smug smile", "overlay": ""}, {"sequence": 28, "beat": 9, "start": 117.94, "end": 121.87, "phrase": "And these charges have been aggressively marketed and promoted.", "tag": "sigh", "camera": "A", "gesture": "G07 hands clasped > G08 dismissive wave", "expression": "neutral corporate > mildly offended", "overlay": ""}, {"sequence": 29, "beat": 9, "start": 122.67, "end": 125.8, "phrase": "Every newspaper. Every television channel.", "tag": "", "camera": "A", "gesture": "G01 one palm (his right)", "expression": "mildly offended", "overlay": ""}, {"sequence": 30, "beat": 9, "start": 127.35, "end": 134.19, "phrase": "We normally pay a fortune for that kind of coverage, and suddenly nobody wants their logo next to us.", "tag": "sad", "camera": "A", "gesture": "G01 one palm (his right) > G02 shrug", "expression": "mildly offended > delighted > neutral corporate > mock sadness", "overlay": ""}, {"sequence": 31, "beat": 10, "start": 135.17, "end": 139.22, "phrase": "After nearly two years, the commission has agreed with the Premier League.", "tag": "", "camera": "B", "gesture": "G07 hands clasped", "expression": "neutral corporate", "overlay": ""}, {"sequence": 32, "beat": 10, "start": 139.9, "end": 146.01, "phrase": "Apparently, if you provide enough evidence that something happened, they decide it HAPPENED.", "tag": "", "camera": "B", "gesture": "G07 hands clasped", "expression": "neutral corporate > one eyebrow raised", "overlay": ""}, {"sequence": 33, "beat": 10, "start": 146.39, "end": 148.48, "phrase": "Nobody explained that part to us.", "tag": "sad", "camera": "B", "gesture": "G02 shrug", "expression": "one eyebrow raised > neutral corporate > mock sadness", "overlay": ""}, {"sequence": 34, "beat": 11, "start": 149.53, "end": 152.41, "phrase": "They have completely ignored the wider context.", "tag": "", "camera": "A", "gesture": "G02 shrug > G04 palms forward", "expression": "neutral corporate", "overlay": ""}, {"sequence": 35, "beat": 11, "start": 152.85, "end": 154.63, "phrase": "The football was LOVELY.", "tag": "excited", "camera": "A", "gesture": "G04 palms forward > G01 palms up", "expression": "neutral corporate > delighted > smug smile", "overlay": ""}, {"sequence": 36, "beat": 11, "start": 154.89, "end": 156.22, "phrase": "You've seen the passing.", "tag": "", "camera": "A", "gesture": "G01 one palm (his right)", "expression": "smug smile > delighted > brows raised", "overlay": ""}, {"sequence": 37, "beat": 11, "start": 156.48, "end": 159.5, "phrase": "Surely that cancels out a few bank transfers.", "tag": "", "camera": "A", "gesture": "G07 hands clasped", "expression": "brows raised > neutral corporate", "overlay": ""}, {"sequence": 38, "beat": 12, "start": 160.45, "end": 167.64, "phrase": "Our lawyers will now appeal because the ruling contains serious errors of law, principle and fact.", "tag": "sigh", "camera": "A", "gesture": "G07 hands clasped > G05 counting", "expression": "neutral corporate", "overlay": ""}, {"sequence": 39, "beat": 12, "start": 167.94, "end": 170.01, "phrase": "The LAW was applied to us.", "tag": "", "camera": "A", "gesture": "G07 hands clasped", "expression": "neutral corporate", "overlay": ""}, {"sequence": 40, "beat": 12, "start": 170.43, "end": 172.8, "phrase": "PRINCIPLES were expected of us.", "tag": "", "camera": "A", "gesture": "G07 hands clasped", "expression": "neutral corporate > brows raised", "overlay": ""}, {"sequence": 41, "beat": 12, "start": 173.12, "end": 175.79, "phrase": "And the FACTS have been made public.", "tag": "", "camera": "A", "gesture": "G07 hands clasped", "expression": "brows raised", "overlay": ""}, {"sequence": 42, "beat": 12, "start": 176.92, "end": 178.71, "phrase": "You can see why we are concerned.", "tag": "", "camera": "B", "gesture": "G07 hands clasped", "expression": "neutral corporate", "overlay": ""}, {"sequence": 43, "beat": 13, "start": 179.63, "end": 181.8, "phrase": "Remember, we have been here before.", "tag": "excited", "camera": "A", "gesture": "G07 hands clasped", "expression": "neutral corporate > delighted", "overlay": ""}, {"sequence": 44, "beat": 13, "start": 182.35, "end": 185.49, "phrase": "In 2020, we appealed to CAS and won.", "tag": "", "camera": "A", "gesture": "G03 index finger", "expression": "delighted", "overlay": ""}, {"sequence": 45, "beat": 13, "start": 185.89, "end": 188.48, "phrase": "We mention this whenever ANYTHING happens.", "tag": "", "camera": "A", "gesture": "G07 hands clasped", "expression": "delighted", "overlay": ""}, {"sequence": 46, "beat": 13, "start": 188.78, "end": 190.51, "phrase": "Parking ticket? CAS.", "tag": "", "camera": "A", "gesture": "G07 hands clasped > G08 dismissive wave", "expression": "delighted > neutral corporate", "overlay": "CAS"}, {"sequence": 47, "beat": 13, "start": 190.84, "end": 192.79, "phrase": "Late invoice? CAS.", "tag": "", "camera": "A", "gesture": "G08 dismissive wave > G07 hands clasped", "expression": "neutral corporate", "overlay": "CAS"}, {"sequence": 48, "beat": 13, "start": 193.11, "end": 195.81, "phrase": "My wife says I haven't emptied the dishwasher?", "tag": "", "camera": "A", "gesture": "G07 hands clasped", "expression": "neutral corporate", "overlay": "CAS"}, {"sequence": 49, "beat": 13, "start": 196.16, "end": 197.96, "phrase": "We've been CLEARED of this before.", "tag": "laughs", "camera": "C", "gesture": "G07 hands clasped", "expression": "neutral corporate > smug smile", "overlay": ""}, {"sequence": 50, "beat": 14, "start": 198.61, "end": 202.07, "phrase": "We will pursue every legal avenue available.", "tag": "excited", "camera": "A", "gesture": "G07 hands clasped > G01 palms up", "expression": "neutral corporate", "overlay": ""}, {"sequence": 51, "beat": 14, "start": 202.75, "end": 210.93, "phrase": "Our preference remains the avenue where we KEEP everything and everyone else stops fucking asking.", "tag": "", "camera": "A", "gesture": "G01 palms up > G05 counting > G06 arms folded", "expression": "neutral corporate", "overlay": ""}, {"sequence": 52, "beat": 15, "start": 211.75, "end": 217.06, "phrase": "We will also seek compensation from anyone damaging our reputation.", "tag": "sad", "camera": "B", "gesture": "G06 arms folded > G07 hands clasped", "expression": "neutral corporate > mock sadness", "overlay": ""}, {"sequence": 53, "beat": 15, "start": 217.79, "end": 220.69, "phrase": "Yes, our actions contributed.", "tag": "whispers", "camera": "B", "gesture": "G07 hands clasped", "expression": "mock sadness", "overlay": ""}, {"sequence": 54, "beat": 15, "start": 221.08, "end": 225.33, "phrase": "But people FINDING OUT has made it considerably worse.", "tag": "sigh", "camera": "B > C", "gesture": "G07 hands clasped", "expression": "mock sadness > neutral corporate > mildly offended", "overlay": ""}, {"sequence": 55, "beat": 16, "start": 225.97, "end": 234.11, "phrase": "I know this is a distraction. Please remain focused on our business and our extended City family.", "tag": "sigh", "camera": "A", "gesture": "G07 hands clasped", "expression": "neutral corporate", "overlay": ""}, {"sequence": 56, "beat": 16, "start": 234.66, "end": 244.12, "phrase": "And remember: just because the money goes round several relatives before reaching you doesn't make it any less of a GIFT.", "tag": "laughs", "camera": "A", "gesture": "G07 hands clasped > G01 one palm (his right) > G01 palms up", "expression": "neutral corporate > delighted", "overlay": ""}, {"sequence": 57, "beat": 17, "start": 244.93, "end": 248.61, "phrase": "Please follow the usual procedure for enquiries.", "tag": "", "camera": "A", "gesture": "G07 hands clasped", "expression": "neutral corporate", "overlay": ""}, {"sequence": 58, "beat": 17, "start": 249.21, "end": 252.9, "phrase": "If a supporter asks, say we are INNOCENT.", "tag": "", "camera": "A", "gesture": "G05 counting > G07 hands clasped", "expression": "neutral corporate", "overlay": ""}, {"sequence": 59, "beat": 17, "start": 253.51, "end": 257.36, "phrase": "If a journalist asks, say we are APPEALING.", "tag": "", "camera": "A", "gesture": "G05 counting > G07 hands clasped", "expression": "neutral corporate", "overlay": "SUPPORTER -> INNOCENT"}, {"sequence": 60, "beat": 17, "start": 258.49, "end": 262.66, "phrase": "If a sponsor asks, check whether it's actually the owner.", "tag": "whispers", "camera": "A > B (push)", "gesture": "G07 hands clasped", "expression": "neutral corporate > glance > neutral corporate", "overlay": ""}, {"sequence": 61, "beat": 18, "start": 263.35, "end": 269.73, "phrase": "Very soon, we will look back on this as another time we faced adversity and overcame it together.", "tag": "excited", "camera": "A", "gesture": "G07 hands clasped > G01 palms up", "expression": "neutral corporate > delighted", "overlay": ""}, {"sequence": 62, "beat": 18, "start": 270.12, "end": 272.6, "phrase": "Admittedly, we CREATED the adversity.", "tag": "whispers", "camera": "A", "gesture": "G07 hands clasped", "expression": "delighted > neutral corporate", "overlay": ""}, {"sequence": 63, "beat": 18, "start": 272.99, "end": 275.36, "phrase": "But we also created the sponsorship revenue.", "tag": "excited", "camera": "A", "gesture": "G07 hands clasped > G01 palms up", "expression": "neutral corporate > delighted", "overlay": ""}, {"sequence": 64, "beat": 18, "start": 275.71, "end": 278.13, "phrase": "You have to look at the POSITIVES.", "tag": "laughs", "camera": "A > B (push)", "gesture": "G07 hands clasped", "expression": "delighted > smug smile", "overlay": ""}, {"sequence": 65, "beat": 19, "start": 278.52, "end": 279.0, "phrase": "Thank you.", "tag": "", "camera": "B", "gesture": "G07 hands clasped", "expression": "neutral corporate > delighted", "overlay": ""}, {"sequence": 66, "beat": 19, "start": 279.4, "end": 283.2, "phrase": "And please remember: money cannot buy success.", "tag": "", "camera": "B", "gesture": "G07 hands clasped", "expression": "delighted > neutral corporate", "overlay": ""}, {"sequence": 67, "beat": 19, "start": 283.52, "end": 291.42, "phrase": "According to our lawyers, it merely arrives independently, through a commercial partner, shortly before success happens.", "tag": "whispers", "camera": "C2", "gesture": "G07 hands clasped", "expression": "neutral corporate", "overlay": ""}];
const v = document.getElementById('v'), seek = document.getElementById('seek'), time = document.getElementById('time');
const fmt = s => { s = Math.max(0, s || 0); return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); };
const list = document.getElementById('cues');
CUES.forEach((c, i) => {
  const d = document.createElement('div'); d.className = 'cue'; d.id = 'c' + i;
  d.innerHTML = `<div class="t">${fmt(c.start)} &middot; beat ${c.beat} &middot; ${c.camera}</div><div>${c.phrase}</div>` +
                `<div class="m">${c.gesture}${c.expression ? ' &middot; ' + c.expression : ''}${c.overlay ? ' &middot; [' + c.overlay + ']' : ''}</div>`;
  d.onclick = () => { v.currentTime = c.start - 0.2; v.play(); };
  list.appendChild(d);
});
const playBtn = document.getElementById('play');
playBtn.onclick = () => v.paused ? v.play() : v.pause();
v.onplay = () => playBtn.textContent = 'Pause'; v.onpause = () => playBtn.textContent = 'Play';
document.getElementById('restart').onclick = () => { v.currentTime = 0; v.play(); };
seek.oninput = () => { if (v.duration) v.currentTime = seek.value / 1000 * v.duration; };
let last = -1;
v.ontimeupdate = () => {
  if (v.duration) { seek.value = v.currentTime / v.duration * 1000; time.textContent = fmt(v.currentTime) + ' / ' + fmt(v.duration); }
  let k = -1; CUES.forEach((c, i) => { if (v.currentTime >= c.start - 0.05) k = i; });
  if (k !== last) { if (last >= 0) document.getElementById('c' + last).classList.remove('now');
    if (k >= 0) { const e = document.getElementById('c' + k); e.classList.add('now'); e.scrollIntoView({block: 'nearest'}); } last = k; }
};
v.onloadedmetadata = () => { time.textContent = fmt(0) + ' / ' + fmt(v.duration); v.textTracks[0].mode = cc ? 'showing' : 'hidden'; };
function setFmt(f) {
  const t = v.currentTime, playing = !v.paused;
  document.getElementById('src').src = 'soriano_parody_' + f + '.mp4'; v.load();
  v.addEventListener('loadedmetadata', () => { v.currentTime = t; if (playing) v.play(); }, {once: true});
  document.getElementById('fmt-p').classList.toggle('on', f === 'portrait');
  document.getElementById('fmt-l').classList.toggle('on', f === 'landscape');
}
document.getElementById('fmt-p').onclick = () => setFmt('portrait');
document.getElementById('fmt-l').onclick = () => setFmt('landscape');
v.addEventListener('error', () => { if (document.getElementById('src').src.includes('landscape')) { alert('The landscape version is not rendered yet.'); setFmt('portrait'); } }, true);
let cc = false; const ccBtn = document.getElementById('cc');
ccBtn.onclick = () => { cc = !cc; v.textTracks[0].mode = cc ? 'showing' : 'hidden'; ccBtn.textContent = cc ? 'Subtitles on' : 'Subtitles off'; ccBtn.classList.toggle('on', cc); };
document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playBtn.click(); } });
</script></body></html>
